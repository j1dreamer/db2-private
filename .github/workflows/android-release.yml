name: Build signed Android development APK
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-dev-release
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.1.0-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify original client archive
        run: python tools/download_original.py --output .release/original.zip
      - name: Verify APK signer checksum
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected=Path('vendor/checksum-sha256.txt').read_text().split()[0]
          assert hashlib.sha256(Path('vendor/uber-apk-signer.jar').read_bytes()).hexdigest()==expected
          PY
      - name: Repackage Android client
        run: python tools/build_client.py --source .release/original.zip --bundle client/main.decoded.js --output .release/unsigned/DB2-Private-Android-dev.apk
      - name: Sign and verify APK
        run: java -jar vendor/uber-apk-signer.jar -a .release/unsigned/DB2-Private-Android-dev.apk -o .release/signed
      - name: Prepare release files
        run: |
          mkdir -p .release/publish
          cp .release/signed/DB2-Private-Android-dev-aligned-debugSigned.apk .release/publish/DB2-Private-Android-dev.apk
          cd .release/publish
          sha256sum DB2-Private-Android-dev.apk > SHA256SUMS.txt
      - name: Upload APK and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" .release/publish/DB2-Private-Android-dev.apk .release/publish/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
